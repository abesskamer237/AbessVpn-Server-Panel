services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      VPN_PORT: "443"
      VLESS_WS_PATH: /@abess237
    volumes:
      - abessvpn_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - abessvpn

  xray:
    build:
      context: ./docker/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - abessvpn_data:/shared
    expose:
      - "10000"
    ports:
      # Native authenticated/encrypted transports. Only expose what is required by the chosen profile.
      - "10021:10021/tcp" # VMess over TCP/RAW
      - "10023:10023/tcp" # Shadowsocks AEAD over TCP/RAW
      - "10031:10031/udp" # VMess over mKCP/UDP
      - "10050:10050/tcp" # Native Shadowsocks TCP
      - "10050:10050/udp" # Native Shadowsocks UDP
    healthcheck:
      test: ["CMD-SHELL", "test -s /shared/xray-ready && test -s /shared/xray-config.json && test -s /shared/xray.pid && kill -0 $(cat /shared/xray.pid)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - abessvpn

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      xray:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abessvpn

volumes:
  abessvpn_data:
  caddy_data:
  caddy_config:

networks:
  abessvpn:
    driver: bridge
