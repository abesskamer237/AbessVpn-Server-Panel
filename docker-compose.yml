services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: abess
      POSTGRES_DB: abess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a persistent random PostgreSQL password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Configure a separate application database password}
    volumes:
      - abessvpn_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abess -d abess"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - abessvpn

  api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      # Production is single protocol: managed SSH over TLS WebSocket.
      SSH_WSS_ONLY: "true"
      DATABASE_URL: postgresql://abess_app:${POSTGRES_APP_PASSWORD}@database:5432/abess
      POSTGRES_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      NODE_USE_ENV_PROXY: "1"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - abessvpn_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - abessvpn

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Permission to connect to the private SSH-WS Unix socket, installed
    # manually on the host. Missing socket keeps only /ssh-ws/* unavailable.
    group_add:
      - "${SSH_WS_GATEWAY_GID:-65534}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      VPN_DOMAIN: ${VPN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/abess-ssh-ws/socket:/var/run/abess-ssh-ws:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abessvpn

volumes:
  abessvpn_postgres:
  abessvpn_data:
  caddy_data:
  caddy_config:

networks:
  abessvpn:
    driver: bridge
