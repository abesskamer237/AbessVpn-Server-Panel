services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: abess
      POSTGRES_DB: abess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a persistent random PostgreSQL password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Configure a separate application database password}
    volumes:
      - abessvpn_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abess -d abess"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - abessvpn

  api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      VPN_PORT: "443"
      VLESS_WS_PATH: /@abess237
      DATABASE_URL: postgresql://abess_app:${POSTGRES_APP_PASSWORD}@database:5432/abess
      POSTGRES_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      NODE_USE_ENV_PROXY: "1"
      SSH_GATEWAY_ENABLED: "true"
      SSH_CONTROL_DIR: /ssh-control
      SSH_TCP_PORT: ${SSH_TCP_PORT:-2222}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - abessvpn_data:/app/data
      - ssh_control:/ssh-control
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - abessvpn

  xray:
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m"]
    build:
      context: ./docker/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - abessvpn_data:/shared
    expose:
      - "10000"
    healthcheck:
      test: ["CMD-SHELL", "test -s /shared/xray-ready && test -s /shared/xray-config.json && test -s /shared/xray.pid && kill -0 $(cat /shared/xray.pid)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - abessvpn

  ssh:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/ssh-gateway.mjs"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m"]
    environment:
      SSH_CONTROL_DIR: /ssh-control
      SSH_DATA_DIR: /ssh-data
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ssh_control:/ssh-control
      - ssh_data:/ssh-data
    ports:
      - "${SSH_TCP_PORT:-2222}:2222"
    expose: ["8085"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [abessvpn]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      xray:
        condition: service_healthy
      ssh:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "2084:2084"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abessvpn

volumes:
  ssh_control:
  ssh_data:
  abessvpn_postgres:
  abessvpn_data:
  caddy_data:
  caddy_config:

networks:
  abessvpn:
    driver: bridge
