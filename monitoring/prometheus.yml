global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: abess-api
    metrics_path: /api/v1/admin/metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
  - job_name: public-https
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://ABESS_DOMAIN/api/v1/ping']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
