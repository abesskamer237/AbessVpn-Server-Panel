# Reporting only; VPN software and its statistics exporter are managed separately.
services:
  agent:
    build: .
    command: ["node", "scripts/node-agent.mjs"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m"]
    environment:
      CONTROL_API_BASE_URL: ${CONTROL_API_BASE_URL:?HTTPS control-plane origin required}
      VPN_NODE_ID: ${VPN_NODE_ID:?Register the external server}
      VPN_NODE_KEY: ${VPN_NODE_KEY:?Store the node key securely}
      STATS_FILE: /stats/snapshot.json
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - ${VPN_STATS_DIR:?Read-only statistics directory}:/stats:ro
