name: Apply client-control fix only
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-client-control-fix.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh" "$HOME/.local/bin"
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"; chmod 600 "$HOME/.ssh/id_ed25519"; elif [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then sudo apt-get update -qq && sudo apt-get install -y -qq sshpass; else exit 1; fi
          if [[ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]]; then printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; else ssh-keyscan -T 12 -p "${VPS_PORT:-22}" -t ed25519 "$VPS_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"; fi
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.local/bin/abess-ssh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -s "$HOME/.ssh/id_ed25519" ]]; then exec ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$@"; fi
          export SSHPASS="$VPS_SSH_PASSWORD"; exec sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$@"
          SH
          cat > "$HOME/.local/bin/abess-scp" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -s "$HOME/.ssh/id_ed25519" ]]; then exec scp -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$@"; fi
          export SSHPASS="$VPS_SSH_PASSWORD"; exec sshpass -e scp -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$@"
          SH
          chmod 700 "$HOME/.local/bin/abess-ssh" "$HOME/.local/bin/abess-scp"
      - name: Update panel and reconciler only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
        run: |
          "$HOME/.local/bin/abess-scp" -P "${VPS_PORT:-22}" src/App.tsx "${VPS_USER}@${VPS_HOST}:abessvpn-server/src/App.tsx"
          "$HOME/.local/bin/abess-scp" -P "${VPS_PORT:-22}" src/components/SshCenter.tsx "${VPS_USER}@${VPS_HOST}:abessvpn-server/src/components/SshCenter.tsx"
          "$HOME/.local/bin/abess-scp" -P "${VPS_PORT:-22}" modules/ssh.ts "${VPS_USER}@${VPS_HOST}:abessvpn-server/modules/ssh.ts"
          "$HOME/.local/bin/abess-scp" -P "${VPS_PORT:-22}" scripts/ssh-ws-reconciler.mjs "${VPS_USER}@${VPS_HOST}:abessvpn-server/scripts/ssh-ws-reconciler.mjs"
          "$HOME/.local/bin/abess-ssh" -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/abessvpn-server"
          tunnel_before="$(systemctl show -p MainPID --value willy-ssh-ws.service)"
          gateway_before="$(systemctl show -p MainPID --value abess-ssh-ws-gateway.service)"
          docker compose build api
          docker compose up -d --no-deps api
          systemctl restart abess-ssh-ws-reconciler.service
          sleep 14
          systemctl is-active --quiet abess-ssh-ws-reconciler.service
          tunnel_after="$(systemctl show -p MainPID --value willy-ssh-ws.service)"
          gateway_after="$(systemctl show -p MainPID --value abess-ssh-ws-gateway.service)"
          echo "TUNNEL_PID_BEFORE=$tunnel_before"
          echo "TUNNEL_PID_AFTER=$tunnel_after"
          echo "GATEWAY_PID_BEFORE=$gateway_before"
          echo "GATEWAY_PID_AFTER=$gateway_after"
          test -n "$tunnel_before" && test "$tunnel_before" = "$tunnel_after"
          test -n "$gateway_before" && test "$gateway_before" = "$gateway_after"
          echo "=== MANAGED USER STATUS ==="
          for u in abv_abess abv_abess3 abv_9ec5099074bf abv_5fb0bc718103; do
            if id "$u" >/dev/null 2>&1; then passwd -S "$u" | awk '{print $1,$2}'; fi
          done
          echo "=== RECONCILER STATE ==="
          python3 -c 'import json; j=json.load(open("/var/lib/abess-ssh-ws/state.json")); [print(u,"enabled="+str(v.get("enabled"))) for u,v in sorted((j.get("state") or {}).items()) if u in {"abv_abess","abv_abess3","abv_9ec5099074bf","abv_5fb0bc718103"}]'
          curl --fail --silent --show-error --max-time 15 https://abessserveur.pagnol.xyz/api/v1/ping
          REMOTE
