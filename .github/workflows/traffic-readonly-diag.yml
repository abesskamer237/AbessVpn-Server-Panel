name: One-time read-only traffic diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/traffic-readonly-diag.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh" "$HOME/.local/bin"
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          elif [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          else exit 1; fi
          if [[ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 12 -p "${VPS_PORT:-22}" -t ed25519 "$VPS_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.local/bin/abess-ssh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -s "$HOME/.ssh/id_ed25519" ]]; then
            exec ssh -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$@"
          fi
          export SSHPASS="$VPS_SSH_PASSWORD"
          exec sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$@"
          SH
          chmod 700 "$HOME/.local/bin/abess-ssh"
      - name: Read-only traffic service diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          "$HOME/.local/bin/abess-ssh" -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== LISTENERS 8080 ==='
          ss -ltnp '( sport = :8080 )' || true
          echo '=== PROCESS 8080 ==='
          pid="$(ss -ltnp '( sport = :8080 )' 2>/dev/null | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -n1)"
          if [[ -n "$pid" && -r "/proc/$pid/cmdline" ]]; then
            tr '\0' ' ' < "/proc/$pid/cmdline"; echo
            echo "PID=$pid"
            echo "EXE=$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            echo "CWD=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
          fi
          echo '=== SYSTEMD MATCH ==='
          systemctl --type=service --state=running --no-pager --plain | grep -Ei 'ssh|ws|websocket|vpn|tunnel|proxy|python|node' || true
          echo '=== ABESS TRAFFIC FILES ==='
          find /var/lib/abess-ssh-ws /etc/abess-ssh-ws -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
          echo '=== GATEWAY HEALTH ==='
          curl --silent --max-time 3 --unix-socket /var/lib/abess-ssh-ws/socket/gateway.sock http://localhost/healthz || true
          echo
          echo '=== USAGE SUMMARY METADATA ==='
          node - <<'NODE' || true
          const fs=require('fs');
          for(const p of ['/var/lib/abess-ssh-ws/gateway/usage.json','/var/lib/abess-ssh-ws/gateway/usage-live.json']){
            try{
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              console.log(p,JSON.stringify({format:j.format,observedAt:j.observedAt,policyObservedAt:j.policyObservedAt,accounts:Array.isArray(j.accounts)?j.accounts.length:undefined,balances:j.balances?Object.keys(j.balances).length:undefined}));
            }catch(e){console.log(p,'UNAVAILABLE')}
          }
          NODE
          echo '=== DONE ==='
          REMOTE
