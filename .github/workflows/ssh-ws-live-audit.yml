name: Live ABESS SSH-WS post-install read-only audit
on:
  push:
    branches: [deploy/sshws-first-install-20261112]
permissions:
  contents: read
jobs:
  smoke:
    name: Confirm actual SSH-WS services, private socket and public WSS routing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Verify public ABESS HTTPS and WSS anonymous rejection
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://abessserveur.pagnol.xyz"
          curl --fail --silent --show-error --max-time 15 "$API_URL/api/v1/ping" | grep -q '"ok":true'
          echo "PUBLIC_PANEL_HTTPS=healthy"
          node --input-type=module <<'JS'
          import {WebSocket} from 'ws';
          const url='wss://abessserveur.pagnol.xyz/ssh-ws/anonymous-is-not-allowed';
          const observed=await new Promise((resolve,reject)=>{
            const ws=new WebSocket(url,{handshakeTimeout:12000,perMessageDeflate:false});
            ws.on('unexpected-response',(_req,res)=>{const code=res.statusCode;res.resume();resolve(code);});
            ws.on('error',reject);
            ws.on('open',()=>{ws.terminate();reject(Error('Unauthenticated WSS accepted'));});
          });
          console.log('PUBLIC_WSS_RESPONSE_HTTP_'+observed);
          process.exit(0); // force-close client HTTP upgrade probe socket
          console.log('PUBLIC_WSS_ROUTING=healthy_anonymous_denied');
          JS
      - name: Verify host's isolated OpenSSH and gateway via SSH (read-only)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          matched=no
          for attempt in 1 2 3; do
            ssh-keyscan -T 12 -p "$PORT" -t ed25519 "$VPS_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts" || true
            if [[ -s "$HOME/.ssh/known_hosts" ]]; then
              echo "SSH_SCAN_PRESENT=yes"
              ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | sed -E 's/^.*(SHA256:[A-Za-z0-9+/]+).*$/SSH_SCAN_FINGERPRINT=\\1/'
              if ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | grep -Fq 'SHA256:LgoMnkXsbf7RYOw5LRm0ErLVQ6n0JDJBJIAltFxOChc'; then
                matched=yes
                break
              fi
              echo "::error::VPS SSH host key differs from pinned pre-install fingerprint"
              exit 1
            fi
            echo "::warning::VPS SSH scan attempt $attempt did not return an Ed25519 key"
            sleep 3
          done
          [[ "$matched" = yes ]] || { echo "::error::VPS SSH fingerprint could not be checked"; exit 1; }
          chmod 0600 "$HOME/.ssh/known_hosts"
          echo 'STAGE_SSH_HOST_FINGERPRINT=verified'
          if ! command -v sshpass >/dev/null 2>&1; then
            echo 'STAGE_SSHPASS_INSTALL=starting'
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
          fi
          echo 'STAGE_SSHPASS=ready'
          export SSHPASS="$VPS_PASSWORD"
          echo 'STAGE_REMOTE_SSH=connecting'
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo 'STAGE_REMOTE_SSH=authenticated'
          for service in abess-ssh-ws-sshd abess-ssh-ws-gateway abess-ssh-ws-reconciler; do
            echo "SERVICE_${service}=$(systemctl is-active "$service" 2>/dev/null || echo failed)"
            systemctl show "$service" -p ActiveState -p SubState -p Result -p NRestarts --no-pager 2>/dev/null || true
            echo "SERVICE_JOURNAL_${service}_BEGIN"
            journalctl -u "$service" --no-pager -n 12 -o cat 2>/dev/null | grep -v -Ei 'bearer|password|apikey|api.key|token:|secret' | tail -12 || true
            echo "SERVICE_JOURNAL_${service}_END"
          done
          [[ -S /var/lib/abess-ssh-ws/socket/gateway.sock ]]
          echo "HOST_UNIX_SOCKET=present"
          curl --fail --silent --show-error --max-time 8 --unix-socket /var/lib/abess-ssh-ws/socket/gateway.sock http://localhost/healthz | grep -q '"policyReady":true'
          echo "GATEWAY_POLICY=ready"
          /usr/sbin/sshd -t -f /etc/abess-ssh-ws/sshd_config
          echo "ISOLATED_SSHD_CONFIG=valid"
          ss -lntH | grep -Eq '127\.0\.0\.1:2222[[:space:]]'
          if ss -lntH | grep -E ':2080[[:space:]]'; then echo "::error::Public TCP gateway socket unexpectedly open"; exit 1; fi
          echo "ISOLATED_SSHD_LOCAL_ONLY=yes"
          node -e '
          const fs=require("node:fs");
          const text=fs.readFileSync("/etc/abess-ssh-ws/agent.env","utf8");
          const obj=Object.fromEntries(text.split("\n").filter(x=>x.includes("=")).map(x=>x.split(/=(.*)/s).slice(0,2)));
          const id=obj.VPN_NODE_ID;
          const key=fs.readFileSync(obj.VPN_NODE_KEY_FILE,"utf8").trim();
          const url=obj.CONTROL_API_BASE_URL+"/api/v1/nodes/"+id+"/ssh-ws/desired";
          fetch(url,{headers:{Authorization:"Bearer "+key},signal:AbortSignal.timeout(8000)}).then(async r=>{
            if(!r.ok)throw Error("Node manifest unavailable: HTTP "+r.status);
            const j=await r.json();
            if(j.format!=="abess-managed-ssh-ws-v1")throw Error("Unexpected manifest format");
            console.log("MANAGED_NODE_API=authenticated_healthy");
            console.log("MANAGED_ACCOUNT_COUNT="+j.accounts.length);
          }).catch(e=>{console.error(e.message);process.exitCode=1;});
          '
          cd "$HOME/abessvpn-server"
          docker compose ps --format 'table {{.Service}}\t{{.State}}'
          echo 'CADDY_RECENT_ERRORS='
          docker compose logs --tail 30 caddy 2>&1 | grep -E '502|websocket|reverse_proxy|dial unix|permission denied|error' | sed -E 's@/ssh-ws/[A-Za-z0-9_-]+@/ssh-ws/REDACTED@g' | tail -20 || true
          echo "LIVE_SSH_WS_DIAGNOSTIC_DUMP=COMPLETE"
          REMOTE

# Recheck after verified SSH-WS installation 2026-11-12
