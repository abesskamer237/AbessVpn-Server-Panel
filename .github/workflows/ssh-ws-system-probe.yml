name: SSH-WS VPS system probe
on:
  push:
    branches: [deploy/ssh-ws-preflight-20261112]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pinned SSH remote environment inspection (read-only)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_KNOWN: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          [[ "${VPS_HOST:-}" =~ ^[A-Za-z0-9.-]+$ && "${VPS_USER:-}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || exit 1
          install -d -m 0700 "$HOME/.ssh"
          if [[ -n "${VPS_KNOWN:-}" ]]; then
            printf '%s\n' "$VPS_KNOWN" > "$HOME/.ssh/known_hosts"
            expected='SHA256:LgoMnkXsbf7RYOw5LRm0ErLVQ6n0JDJBJIAltFxOChc'
            ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | grep -Fq "$expected" || { echo 'Pinned host key differs from prior known public key; investigate.'; exit 1; }
          else
            # TOFU only after equality to a public key fingerprint recorded
            # independently by a previous GH Actions run on 2026-11-12.
            ssh-keyscan -T 10 -p "$PORT" -t ed25519 "$VPS_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
            [[ -s "$HOME/.ssh/known_hosts" ]] || exit 1
            ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | grep -Fq 'SHA256:LgoMnkXsbf7RYOw5LRm0ErLVQ6n0JDJBJIAltFxOChc' || { echo "::error::Host key changed since earlier scan, refusing SSH"; exit 1; }
            echo "::warning::SSH TOFU: host key fingerprint matches earlier public scan, not independently verified by provider console"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! command -v sshpass >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null; fi
          export SSHPASS="$VPS_PASSWORD"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "OS=$(source /etc/os-release; echo "$ID $VERSION_ID")"
          echo "ARCH=$(uname -m)"
          echo "EUID=$(id -u)"
          if [ "$(id -u)" = 0 ] || (command -v sudo >/dev/null && sudo -n true </dev/null 2>/dev/null); then echo "CAN_ROOT=yes"; else echo "CAN_ROOT=no"; fi
          for c in curl git npm node rsync docker sshd openssl ssh-keygen systemctl; do
            if command -v "$c" >/dev/null 2>&1 || [ "$c" = sshd ] && [ -x /usr/sbin/sshd ]; then
              case "$c" in node) echo "node=$(node -v)";; npm) echo "npm=$(npm -v)";; *) echo "cmd:$c=present";; esac
            else echo "cmd:$c=missing"; fi
          done
          echo "DOCKER_COMPOSE=$(docker compose version --short 2>/dev/null || echo unavailable)"
          printf 'LOGIN_HOME=%s\n' "$HOME"
          for f in "$HOME/abessvpn-server/.env" "$HOME/abessvpn-server/INITIAL_ADMIN_CREDENTIALS.txt" /opt/abess-panel/package.json; do [ -e "$f" ] && echo "FILE:$f=yes" || echo "FILE:$f=no"; done
          for svc in abess-ssh-ws-sshd abess-ssh-ws-gateway abess-ssh-ws-reconciler; do echo "svc:$svc=$(systemctl is-active "$svc" 2>/dev/null || true)"; done
          if [ -f "$HOME/abessvpn-server/.env" ]; then
             for k in VPN_DOMAIN ADMIN_EMAIL ADMIN_INITIAL_PASSWORD MASTER_SECRET SSH_WS_GATEWAY_GID; do
                if grep -q "^$k=" "$HOME/abessvpn-server/.env"; then echo "ENV:$k=set"; else echo "ENV:$k=absent"; fi
             done
          fi
          if [ -f /etc/ssh/ssh_host_ed25519_key.pub ]; then
            ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | sed -n 's/.*\(SHA256:[A-Za-z0-9+/]*\).*/SERVER_HOSTKEY=\1/p'
          fi
          docker ps --format 'CONTAINER={{.Names}}' 2>/dev/null || true
          REMOTE
