name: Deploy ABESS VPN to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abessvpn-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate code and container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build admin panel
        run: npm run build

      - name: Validate shell script syntax
        run: sh -n docker/xray/watch-config.sh

      - name: Build API image
        run: docker build --pull -f Dockerfile -t abessvpn-api:ci .

      - name: Build Xray-core sidecar image
        run: docker build --pull -f docker/xray/Dockerfile -t abessvpn-xray:ci ./docker/xray

      - name: Validate Compose file
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config -q
          rm -f .env

  deploy:
    name: Deploy control plane, Xray-core and HTTPS
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings and prepare private environment file
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const required = [
            'VPS_HOST', 'VPS_USER', 'VPS_KNOWN_HOSTS',
            'VPN_DOMAIN', 'ADMIN_EMAIL', 'ADMIN_INITIAL_PASSWORD', 'MASTER_SECRET'
          ];
          for (const key of required) {
            if (!process.env[key] || !process.env[key].trim()) {
              throw new Error(`Missing GitHub secret/variable: ${key}`);
            }
          }
          if (!process.env.VPS_SSH_KEY?.trim() && !process.env.VPS_SSH_PASSWORD?.trim()) {
            throw new Error('Set VPS_SSH_KEY (recommended) or VPS_SSH_PASSWORD in GitHub Actions secrets.');
          }
          if (process.env.ADMIN_INITIAL_PASSWORD.length < 16) {
            throw new Error('ADMIN_INITIAL_PASSWORD must be at least 16 characters.');
          }
          if (process.env.MASTER_SECRET.length < 32) {
            throw new Error('MASTER_SECRET must be at least 32 random characters.');
          }
          const hostname = process.env.VPN_DOMAIN;
          const hostnamePattern = /^(?=.{1,253}$)([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)(\.([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?))*$/;
          if (!hostnamePattern.test(hostname)) {
            throw new Error('VPN_DOMAIN must be a hostname only, without https://, a port, or a path.');
          }

          const values = {
            VPN_DOMAIN: hostname,
            ACME_EMAIL: process.env.ACME_EMAIL || process.env.ADMIN_EMAIL,
            ADMIN_EMAIL: process.env.ADMIN_EMAIL,
            ADMIN_NAME: process.env.ADMIN_NAME || 'ABESS VPN Administrator',
            ADMIN_INITIAL_PASSWORD: process.env.ADMIN_INITIAL_PASSWORD,
            MASTER_SECRET: process.env.MASTER_SECRET
          };
          const envText = Object.entries(values)
            .map(([key, value]) => key + '=' + JSON.stringify(value))
            .join('\n') + '\n';
          fs.writeFileSync('.deploy.env', envText, { mode: 0o600 });
          NODE

      - name: Configure SSH authentication
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh" "$HOME/.local/bin"
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          elif [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.local/bin/abess-ssh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then
            export SSHPASS="$VPS_SSH_PASSWORD"
            exec sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$@"
          fi
          exec ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$@"
          SH
          cat > "$HOME/.local/bin/abess-scp" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then
            export SSHPASS="$VPS_SSH_PASSWORD"
            exec sshpass -e scp -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no "$@"
          fi
          exec scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes "$@"
          SH
          chmod 700 "$HOME/.local/bin/abess-ssh" "$HOME/.local/bin/abess-scp"
      - name: Preflight VPS without stopping existing services
        shell: bash
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          DEST="${VPS_USER}@${VPS_HOST}"
          "$HOME/.local/bin/abess-ssh" -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$DEST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on the VPS." >&2; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose plugin is missing." >&2; exit 1; }
          command -v rsync >/dev/null 2>&1 || { echo "rsync is not installed on the VPS." >&2; exit 1; }
          command -v ss >/dev/null 2>&1 || { echo "iproute2/ss is not installed on the VPS." >&2; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "curl is not installed on the VPS." >&2; exit 1; }
          docker info >/dev/null 2>&1 || { echo "SSH user must be able to run Docker non-interactively." >&2; exit 1; }
          mkdir -p "$HOME/abessvpn-server"
          test -w "$HOME/abessvpn-server" || { echo "Cannot write to ~/abessvpn-server." >&2; exit 1; }

          existing_caddy=""
          if [ -f "$HOME/abessvpn-server/docker-compose.yml" ]; then
            existing_caddy="$(cd "$HOME/abessvpn-server" && docker compose ps -q caddy 2>/dev/null || true)"
          fi
          busy="$(ss -ltnH 2>/dev/null | awk '$4 ~ /:(80|443)$/ {print $4}' || true)"
          if [ -n "$busy" ] && [ -z "$existing_caddy" ]; then
            echo "Ports 80/443 are occupied by another service. Deployment stopped to protect it." >&2
            echo "$busy" >&2
            exit 1
          fi

          # Check the dedicated direct-protocol ports too; never silently stop x-ui/Xray or another service.
          busy_native_tcp="$(ss -ltnH 2>/dev/null | awk '$4 ~ /:(10021|10023|10050)$/ {print $4}' || true)"
          busy_native_udp="$(ss -lunH 2>/dev/null | awk '$4 ~ /:(10031|10050)$/ {print $4}' || true)"
          if { [ -n "$busy_native_tcp" ] || [ -n "$busy_native_udp" ]; } && [ -z "$existing_caddy" ]; then
            echo "A direct TCP/UDP profile port is already occupied. Deployment stopped to protect existing services." >&2
            printf 'TCP: %s\nUDP: %s\n' "$busy_native_tcp" "$busy_native_udp" >&2
            exit 1
          fi
          echo "VPS preflight passed."
          REMOTE

      - name: Upload application without touching persistent volumes or environment files
        shell: bash
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          DEST="${VPS_USER}@${VPS_HOST}"
          rsync -az --delete -e "$HOME/.local/bin/abess-ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude '.deploy.env' \
            ./ "$DEST:abessvpn-server/"
          "$HOME/.local/bin/abess-scp" -P "$VPS_PORT" -o StrictHostKeyChecking=yes .deploy.env "$DEST:abessvpn-server/.env.new"
          "$HOME/.local/bin/abess-ssh" -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$DEST" 'bash -s' <<'REMOTE'
          chmod 600 "$HOME/abessvpn-server/.env.new"
          REMOTE

      - name: Build and start services, then verify public HTTPS
        shell: bash
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          DEST="${VPS_USER}@${VPS_HOST}"
          "$HOME/.local/bin/abess-ssh" -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$DEST" "VPN_DOMAIN='$VPN_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/abessvpn-server"
          mv .env.new .env
          chmod 600 .env
          docker compose config -q
          docker compose up -d --build --remove-orphans
          docker compose ps

          ready=0
          for ((attempt=1; attempt<=30; attempt++)); do
            response="$(curl --silent --show-error --fail --max-time 8 "https://${VPN_DOMAIN}/api/v1/ping" 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"dataPlane":"ready"'; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Public HTTPS/Xray readiness check failed. Recent service logs follow.' >&2
            docker compose ps >&2 || true
            docker compose logs --tail=100 api xray caddy >&2 || true
            exit 1
          fi
          printf '%s\n' "$response"
          echo 'ABESS VPN control plane and Xray-core report ready.'
          REMOTE
          rm -f .deploy.env

      - name: Remove temporary deployment material
        if: always()
        run: rm -f .deploy.env
