name: Diagnose ABESS production VPS readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-vps-readiness.yml

permissions:
  contents: read

concurrency:
  group: abess-vps-readiness-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only VPS and SSH-WSS health checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure pinned SSH authentication and inspect production health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPN_DOMAIN: ${{ vars.VPN_DOMAIN }}
        run: |
          set -euo pipefail
          [[ "${VPS_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid VPS_HOST." >&2; exit 1; }
          [[ "${VPS_USER:-}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid VPS_USER." >&2; exit 1; }
          [[ "${VPN_DOMAIN:-}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid VPN_DOMAIN." >&2; exit 1; }
          port="${VPS_PORT:-22}"
          if ! [[ "$port" =~ ^[0-9]{1,5}$ ]]; then
            echo "Invalid VPS_PORT." >&2
            exit 1
          fi
          port_value=$((10#$port))
          if (( port_value < 1 || port_value > 65535 )); then
            echo "Invalid VPS_PORT." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"
          elif [[ -n "${VPS_SSH_PASSWORD:-}" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          else
            echo "Set VPS_SSH_KEY or VPS_SSH_PASSWORD/VPS_PASSWORD." >&2
            exit 1
          fi
          if [[ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 12 -p "$port" -t ed25519 "$VPS_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          fi
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 |
            grep -Fq 'SHA256:bbOkBVBY0XxyMLJVAjDmJWLM56VIsyC4+5iaTEopNQM' || {
              echo "::error::VPS SSH host key differs from the verified Contabo identity." >&2
              exit 1
            }
          chmod 600 "$HOME/.ssh/known_hosts"
          destination="${VPS_USER}@${VPS_HOST}"
          if [[ -s "$HOME/.ssh/id_ed25519" ]]; then
            ssh_command=(ssh -p "$port" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          else
            export SSHPASS="$VPS_SSH_PASSWORD"
            ssh_command=(sshpass -e ssh -p "$port" -o StrictHostKeyChecking=yes -o "PreferredAuthentications=password,keyboard-interactive" -o PubkeyAuthentication=no)
          fi
          "${ssh_command[@]}" "$destination" "VPN_DOMAIN='$VPN_DOMAIN' bash -s" <<'REMOTE'
          set -uo pipefail
          cd "$HOME/abessvpn-server" || exit 1
          export COMPOSE_FILE="$PWD/docker-compose.yml"
          failed=0
          echo '=== COMPOSE SERVICES ==='
          docker compose -f "$COMPOSE_FILE" ps -a || failed=1
          echo '=== ALL ABESS CONTAINERS (READ ONLY) ==='
          docker ps -a --no-trunc --filter name=abessvpn-server || true
          echo '=== CADDY CONTAINER DIAGNOSTICS (READ ONLY) ==='
          caddy_id="$(docker ps -aq --filter name=abessvpn-server-caddy-1 | head -n 1)"
          if [[ -n "$caddy_id" ]]; then
            docker inspect --format 'CADDY_STATE status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} image={{.Config.Image}}' "$caddy_id" || true
            docker logs --tail 100 "$caddy_id" 2>&1 || true
          else echo 'CADDY_CONTAINER=not-found'; fi
          echo '=== PUBLIC PORT LISTENERS (READ ONLY) ==='
          ss -lntp '( sport = :80 or sport = :443 )' 2>&1 || true
          echo '=== DOCKER / COMPOSE PROCESSES (READ ONLY) ==='
          ps -eo pid,ppid,etime,stat,args | grep -E '[d]ocker compose|[d]ocker (start|create|container start)|[c]addy run' || true
          echo '=== DOCKER DAEMON HEALTH (READ ONLY) ==='
          systemctl is-active docker 2>/dev/null || true
          docker info --format 'DOCKER_INFO root={{.DockerRootDir}} driver={{.Driver}} containers={{.Containers}} running={{.ContainersRunning}} paused={{.ContainersPaused}} stopped={{.ContainersStopped}}' 2>&1 || true
          echo '=== PRE-DEPLOYMENT SNAPSHOT SIZES (READ ONLY) ==='
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)"
          for volume in abessvpn-server_abessvpn_data abessvpn-server_ssh_data abessvpn-server_abessvpn_postgres; do
            location="$docker_root/volumes/$volume/_data"
            if [[ -d "$location" ]]; then du -sh "$location" 2>/dev/null || true; else echo "VOLUME $volume not-found"; fi
          done
          backup_dir="$HOME/abessvpn-server/deployment-backups"
          if [[ -d "$backup_dir" ]]; then
            du -sh "$backup_dir" 2>/dev/null || true
            find "$backup_dir" -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null | sort | tail -10 || true
          else echo 'DEPLOYMENT_BACKUPS=not-created'; fi
          df -h "$docker_root" | tail -1 || true
          echo '=== API HTTPS PING ==='
          api_response="$(curl --silent --show-error --max-time 10 "https://$VPN_DOMAIN/api/v1/ping" 2>&1 || true)"
          printf '%s\n' "$api_response"
          printf '%s' "$api_response" | grep -q '"ok":true' || failed=1
          echo '=== SSH-WSS SYSTEMD SERVICES ==='
          for service in abess-ssh-ws-sshd.service abess-ssh-ws-gateway.service abess-ssh-ws-reconciler.service; do
            state="$(systemctl is-active "$service" 2>/dev/null || true)"
            printf 'SERVICE %s=%s\n' "$service" "${state:-unknown}"
            [[ "$state" == active ]] || failed=1
          done
          echo '=== SSH-WSS GATEWAY HEALTH ==='
          if [[ -S /var/lib/abess-ssh-ws/socket/gateway.sock ]]; then
            gateway_health="$(curl --silent --show-error --max-time 8 --unix-socket /var/lib/abess-ssh-ws/socket/gateway.sock http://localhost/healthz 2>&1 || true)"
            printf '%s\n' "$gateway_health"
            printf '%s' "$gateway_health" | grep -q '"policyReady":true' || failed=1
          else
            echo 'GATEWAY_SOCKET=missing'
            failed=1
          fi
          [[ "$failed" -eq 0 ]] || exit 1
          echo 'READ_ONLY_VPS_DIAGNOSTIC=HEALTHY'
          REMOTE
