name: Verify ABESS VPN Server Panel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build admin panel
        run: npm run build

      - name: Start API and smoke-test mobile routes
        shell: bash
        run: |
          set -euo pipefail
          PORT=3187 NODE_ENV=production npm run start > /tmp/abessvpn-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3187/api/v1/ping > /tmp/abess-ping.json; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import net from 'node:net';

          const base = 'http://127.0.0.1:3187';

          const pingResponse = await fetch(`${base}/api/v1/ping`);
          assert.equal(pingResponse.status, 200, 'ping route must return HTTP 200');
          const ping = await pingResponse.json();
          assert.equal(ping.ok, true);
          assert.equal(ping.dataPlane, 'not-ready', 'do not claim the tunnel is ready until a real data plane exists');

          const downloadResponse = await fetch(`${base}/api/v1/speedtest/download?bytes=1048576`);
          assert.equal(downloadResponse.status, 200);
          assert.equal((await downloadResponse.arrayBuffer()).byteLength, 1048576);

          const uploadResponse = await fetch(`${base}/api/v1/speedtest/upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: Buffer.alloc(4096, 65),
          });
          assert.equal(uploadResponse.status, 200);
          assert.equal((await uploadResponse.json()).receivedBytes, 4096);

          const createTokenResponse = await fetch(`${base}/api/v1/client/create-token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: 'SHOULD_NOT_BE_CREATED', bandwidthGb: 100 }),
          });
          assert.equal(createTokenResponse.status, 403, 'unauthenticated mobile token creation must be denied');

          const trialResponse = await fetch(`${base}/api/v1/client/claim-free-trial`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deviceId: 'TEST-DEVICE-123456' }),
          });
          assert.equal(trialResponse.status, 503, 'do not issue a trial until the tunnel data plane is real');

          const telemetryResponse = await fetch(`${base}/api/v1/client/telemetry`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
          });
          assert.equal(telemetryResponse.status, 400, 'telemetry must reject a missing token');

          // The seeded test token must validate, and its device limit must be enforced.
          const token = 'ABESS-VIP-ROOT-2026';
          let seededLicenceUuid;
          for (const deviceId of ['CI-DEVICE-ONE', 'CI-DEVICE-TWO']) {
            const response = await fetch(`${base}/api/v1/auth/token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, deviceId }),
            });
            assert.equal(response.status, 200, `registered device ${deviceId} should validate`);
            const result = await response.json();
            assert.equal(result.valid, true);
            assert.equal(result.deviceLimit, 2);
            assert.ok(result.serverConfig.address);
            assert.equal(result.serverConfig.transport, 'ws');
            assert.match(result.serverConfig.uuid, /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
            if (seededLicenceUuid) assert.equal(result.serverConfig.uuid, seededLicenceUuid, 'one licence must keep a stable VLESS UUID');
            seededLicenceUuid = result.serverConfig.uuid;
          }
          const thirdDevice = await fetch(`${base}/api/v1/auth/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, deviceId: 'CI-DEVICE-THREE' }),
          });
          assert.equal(thirdDevice.status, 403, 'token device limit must be enforced');

          const loginResponse = await fetch(`${base}/api/v1/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'rigomanga4@gmail.com', password: 'abess237' }),
          });
          assert.equal(loginResponse.status, 200, 'seeded admin should log in in the isolated CI test');
          const login = await loginResponse.json();

          const adminCreateTokenResponse = await fetch(`${base}/api/v1/admin/tokens`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${login.token}`,
            },
            body: JSON.stringify({ plan: 'CI UUID TEST', bandwidthGb: 2, days: 1, deviceLimit: 1 }),
          });
          assert.equal(adminCreateTokenResponse.status, 201, 'authenticated admin should be able to create a licence');
          const createdLicence = await adminCreateTokenResponse.json();
          assert.match(createdLicence.clientUuid, /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i);
          assert.notEqual(createdLicence.clientUuid, seededLicenceUuid, 'licences must not share the same VLESS UUID');

          const createdTokenValidation = await fetch(`${base}/api/v1/auth/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: createdLicence.token, deviceId: 'CI-NEW-DEVICE' }),
          });
          assert.equal(createdTokenValidation.status, 200);
          const createdTokenData = await createdTokenValidation.json();
          assert.equal(createdTokenData.serverConfig.uuid, createdLicence.clientUuid, 'mobile auth must return the UUID assigned at token creation');

          // Do not send a fake VLESS handshake while no Xray data plane is configured.
          const websocketStatus = await new Promise((resolve, reject) => {
            const socket = net.connect(3187, '127.0.0.1', () => {
              socket.write([
                'GET /@abess237 HTTP/1.1',
                'Host: 127.0.0.1:3187',
                'Connection: Upgrade',
                'Upgrade: websocket',
                'Sec-WebSocket-Version: 13',
                'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==',
                '',
                '',
              ].join('\r\n'));
            });
            let response = '';
            const timeout = setTimeout(() => {
              socket.destroy();
              reject(new Error('WebSocket fail-closed probe timed out'));
            }, 3000);
            socket.on('data', (chunk) => {
              response += chunk.toString('utf8');
              if (response.includes('\r\n\r\n')) {
                clearTimeout(timeout);
                socket.destroy();
                resolve(response);
              }
            });
            socket.on('error', (error) => {
              clearTimeout(timeout);
              reject(error);
            });
          });
          assert.ok(String(websocketStatus).includes('HTTP/1.1 503 Service Unavailable'));

          console.log('Mobile route, token/device-limit, and fail-closed WebSocket smoke tests passed.');
          NODE
