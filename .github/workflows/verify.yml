name: Verify ABESS backend and external traffic

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: abess
          POSTGRES_PASSWORD: ci-only-disposable-postgres-password
          POSTGRES_DB: abess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abess -d abess_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint all GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
      - name: Self-test offline MASTER_SECRET rotation utility
        run: node scripts/rotate-master-secret.mjs --self-test


      - name: Security regression tests
        run: node --import tsx scripts/test-security.mjs

      - name: Verify portable VPN subscription formats
        run: node --import tsx scripts/test-exports.mjs

      - name: Validate and test SSH-WS gateway and reconciler
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-ssh-ws.sh
          bash -n scripts/ssh-ws-postdeploy.sh
          node --check scripts/bootstrap-ssh-ws-node.mjs
          node --check scripts/ssh-ws-gateway.mjs
          node --check scripts/ssh-ws-reconciler.mjs
          node scripts/test-ssh-ws.mjs
          node scripts/benchmark-ssh-ws.mjs

      - name: Verify MFA, backup encryption and manual transfer approval
        run: node --import tsx scripts/test-platform.mjs

      - name: Verify PostgreSQL migration and concurrent transactions
        env:
          TEST_DATABASE_URL: postgresql://abess:ci-only-disposable-postgres-password@127.0.0.1:5432/abess_test
        run: node --import tsx scripts/test-postgres.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Build admin panel
        run: npm run build


      - name: Install Chromium for panel tests
        run: npx playwright install --with-deps chromium

      - name: Verify panel workflows and mobile layout
        run: npx playwright test

      - name: Build API Docker image
        run: docker build --pull -f Dockerfile -t abessvpn-api:ci .

      - name: Verify official Xray traffic and real quota accounting
        run: python3 scripts/test-xray-traffic.py

      - name: Validate Caddyfile routing configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e VPN_DOMAIN=vpn.example.test \
            -e ACME_EMAIL=ci@example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config -q
          rm -f .env

      - name: Verify external API, agent and non-provisioning contract
        run: node --import tsx scripts/test-external-backend.mjs

      - name: Verify mobile API and licence contract
        run: node scripts/test-mobile-contract.mjs

      - name: Verify external traffic storage with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://abess:ci-only-disposable-postgres-password@127.0.0.1:5432/abess_test
        run: node --import tsx scripts/test-external-backend.mjs
