name: SSH-WS VPS read-only preflight

on:
  push:
    branches:
      - deploy/ssh-ws-preflight-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Inspect SSH-WS installation prerequisites without changing VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured credentials without disclosing secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD || secrets.VPS_PASSWORD }}
          VPS_KNOWN: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          NODE_ID: ${{ vars.SSH_WS_NODE_ID || vars.VPN_NODE_ID }}
          NODE_KEY: ${{ secrets.SSH_WS_NODE_KEY || secrets.VPN_NODE_KEY }}
          CONTROL_URL: ${{ vars.SSH_WS_CONTROL_API_BASE_URL }}
          SSH_DOMAIN: ${{ vars.SSH_WS_DOMAIN }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PASSWORD VPS_KNOWN NODE_ID NODE_KEY CONTROL_URL SSH_DOMAIN; do
            if [[ -n "${!name:-}" ]]; then
              echo "SETTING_$name=present"
            else
              echo "SETTING_$name=missing"
            fi
          done
          if [[ -z "${VPS_HOST:-}" || ! "${VPS_HOST:-}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::VPS_HOST missing/invalid"
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && ((PORT>=1&&PORT<=65535)) || exit 1
          # Public scan is identification information only, NEVER auto-trust it
          # for authenticated SSH. The administrator must verify via VPS console.
          if timeout 20 ssh-keyscan -T 7 -p "$PORT" -t ed25519 "$VPS_HOST" 2>/dev/null | grep -E '(^| )ssh-ed25519 ' > /tmp/abess-hostkey; then
            echo "SSH_ED25519_PUBLIC_SCAN=reachable"
            ssh-keygen -lf /tmp/abess-hostkey -E sha256 | sed -E 's/^[0-9]+ /public_key_scan /'
            if [[ -n "${VPS_KNOWN:-}" ]]; then
              printf '%s\n' "$VPS_KNOWN" > /tmp/abess-known
              ssh-keygen -lf /tmp/abess-known -E sha256 | sed -E 's/^[0-9]+ /pinned_key /'
              # No connection until explicit known-host pin is provided.
              echo "AUTHORIZED_SSH_PREFLIGHT=eligible"
            else
              echo "::warning::Authenticated SSH blocked: VPS_SSH_KNOWN_HOSTS not configured"
            fi
          else
            echo "::error::VPS SSH port is unreachable or no Ed25519 key is offered"
            exit 1
          fi
